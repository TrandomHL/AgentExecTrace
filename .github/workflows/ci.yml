name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Check formatting
        shell: pwsh
        run: |
          $unformatted = gofmt -l (git ls-files '*.go')
          if ($unformatted) { $unformatted; exit 1 }
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
