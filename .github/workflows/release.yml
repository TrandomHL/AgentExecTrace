name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Build archives and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'; $env:GOARCH = 'amd64'
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o dist/agentexectrace-windows-amd64.exe .
          Compress-Archive -Path dist/agentexectrace-windows-amd64.exe -DestinationPath dist/agentexectrace-windows-amd64.zip
          $env:GOOS = 'linux'; $env:GOARCH = 'amd64'
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o dist/agentexectrace-linux-amd64 .
          tar -czf dist/agentexectrace-linux-amd64.tar.gz -C dist agentexectrace-linux-amd64
          Get-FileHash dist/*.zip,dist/*.tar.gz -Algorithm SHA256 | ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), $_.Path.Split('\\')[-1] } | Set-Content dist/checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
          fail_on_unmatched_files: true
